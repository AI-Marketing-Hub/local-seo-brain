# Brainstein spec v3
spec_version: 3
slug: "local-seo-brain"
title: "Local SEO Brain"
domain: "Source-cited local search operations, evidence review, and approval-first decision support for Google Search, Google Business Profile, Maps, citations, reviews, and geo-grid workflows"
buyer: "Local SEO agencies and freelancers, multi-location operators, and in-house storefront, hybrid, and service-area business operators who need repeatable evidence-backed decisions without live account mutation."
owner: "Daniel Agrici"
repo_url: "https://github.com/AI-Marketing-Hub/local-seo-brain"
license_name: "MIT License"
research_refresh_cadence: "weekly for ranking rollouts; 14 days for GBP API changes; 30 days for policy, AI feature, and Maps terms; before every release"
workflows:
  - "Claim inventory, evidence classification, and contradiction review"
  - "Immutable source intake with provenance and privacy controls"
  - "GBP, citation, review, and geo-grid export ingestion"
  - "Approval-first synthesis into health evidence, risks, actions, and reports"
  - "Deterministic knowledge seeding with evidence overlays and cross-links"
  - "Weekly evidence freshness, next-action, and release-readiness review"
raw_sources:
  - "Immutable historical Local SEO course export in Markdown, DOCX, and ZIP form"
  - "Operator-supplied GBP, citation, review, geo-grid, Search Console, GA4, and site-audit exports"
  - "Operator decisions, approval records, and rollback notes"
enrichment_sources:
  - "Official Google Search Central documentation and Search Status Dashboard records"
  - "Official Google Business Profile policy, API, reference, and changelog documentation"
  - "Official Google Maps Platform policies, release notes, and terms"
  - "schema.org vocabulary and other relevant primary standards"
  - "Transparent independent local-search studies and controlled tests with auditable methods"
deliverables:
  - "Source and claim ledgers with freshness, risk, confidence, and contradictions"
  - "Health evidence and risk register with explicit no-data states"
  - "Prioritized action roadmap with owner approval and rollback requirements"
  - "Weekly report and evidence-refresh queue"
  - "Approval queue for every proposed account-touching change"
  - "Deterministic Obsidian template and checked-in sample vault"
refusal_rules:
  - "No unsourced, fabricated, or universally quantified local-ranking claim"
  - "No credentials, tokens, cookies, private client data, or review-author PII in repository artifacts"
  - "No live GBP, Search Console, GA4, Maps, citation, review-platform, or client-account mutation"
  - "No address gaming, virtual-office abuse, fake or review-gated reviews, PBN tactics, doorway pages, hidden text, or mass low-quality citations"
  - "No irreversible recommendation without an owner, source, confidence, approval state, and rollback note"
  - "No score, grade, ranking, traffic, cadence, deadline, or performance metric without defined inputs and reproducible calculation"
  - "No market-ready, SSS+, deterministic, source-cited, or tested claim without current gate evidence"
safety_risks:
  - "Stale Google policy, Search feature, GBP API, Maps terms, or structured-data requirements"
  - "Unsafe service-area, storefront, virtual-office, review, or suspension guidance"
  - "Confusing observed correlation, practitioner advice, folklore, and official policy"
  - "Prohibited storage or reuse of Google Places content and review-author identity"
  - "Generated notes losing evidence corrections during re-seeding"
  - "Scripts mutating tracked template or sample files during help, tests, or baseline inspection"
  - "Marketing and release claims exceeding implemented and tested product behavior"
playbook_steps:
  - "Freeze the clean repository baseline and immutable historical seed hashes"
  - "Inventory every material claim and assign a stable claim identifier"
  - "Research official canon and independent counter-evidence within explicit budgets"
  - "Reconcile evidence into canonical ledgers and deterministic knowledge overlays"
  - "Apply canonical vault changes through inspected hash-bound transactions"
  - "Run deterministic builds, privacy checks, both vault lints, tests, and Brainstein gates"
  - "Deliver reviewed local changes and stop before commit, remote publication, or live account mutation"
audit_focus:
  - "Complete source and claim ledger integrity with no stale active high-risk evidence"
  - "Correct Google policy boundaries for eligibility, addresses, reviews, spam, APIs, and Places data"
  - "Durable overlay persistence across re-seeding and byte-deterministic sample generation"
  - "Safe explicit CLI targets, read-only help, dry-run maintenance, and temporary test outputs"
  - "No-data, privacy, approval, and fabrication refusals"
  - "Agreement among product behavior, documentation, versions, counts, and release evidence"
next_action_signals:
  - "An active policy or API source has reached refresh_due"
  - "A high-risk claim lacks controlling official evidence or two independent empirical sources"
  - "A generated projection differs from its canonical ledger or overlay"
  - "A deterministic build hash changes for the same as-of date and fixtures"
  - "Repository or Claude Obsidian lint reports any finding"
  - "Brainstein reports a critical failure or score below 90"
claim_ledger_policy: "every material claim has one assessment and one confidence tag; source statement, inference, recommendation, and policy stay distinct"
second_source_policy: "required for accepted high-risk empirical, comparative, numeric, current-market, and causal claims; controlling official policy may stand alone when no operational inference is added"
source_refresh_days: 30
confidence_policy: "EVIDENCE-BASED, PRACTITIONER, CONTESTED, or FOLKLORE; folklore is never asserted as current fact"
canon_seed_count: 10
canon_targets:
  - "Google Search Essentials"
  - "Google Search Ranking Systems Guide"
  - "Google Search Spam Policies"
  - "Google Core Update Guidance"
  - "Google AI Features and Websites"
  - "Google Business Profile Representation Guidelines"
  - "Google Business Profile Local Ranking Guidance"
  - "Google Business Profile Review and Content Policies"
  - "Google Business Profile API Reference and Changelog"
  - "Google Maps Places Policies and Terms"
canon_fold_targets:
  - "Local Ranking and Search Systems"
  - "Business Profile Eligibility and Safety"
  - "Reviews and User-Contributed Content"
  - "Structured Data and AI Search"
  - "Evidence, Measurement, and Uncertainty"
quality_policy: "Task completeness, claim support, useful resolved links, no boilerplate quotas, and reachability within two hub hops"
seed_gaps:
  - "Claim-level evidence coverage is incomplete across the historical 59 chapters and 37 prompts"
  - "The historical seed contains unsafe and unsupported local-ranking, review, schema, and AI-search claims"
  - "Product scoring and prioritization claims exceed the current draft-only synthesizer"
seed_questions:
  - "Which P0 claims are controlled directly by current official Google policy?"
  - "Which quantitative or causal claims have two independent reproducible sources?"
  - "Which current product claims must be narrowed because behavior is not implemented?"
  - "Which generated corrections need aliases or deprecation callouts to preserve retrieval?"
seed_experiments:
  - "Re-seed with a pinned as-of date and verify overlay and claim-ID persistence"
  - "Regenerate the sample vault twice and compare normalized tree hashes"
  - "Run malformed, missing-data, privacy, and approval-refusal fixtures through every ingestor"
flow_playbooks:
  - "Claim Verification Flow"
  - "Evidence Refresh Flow"
  - "Explore Plan Code Commit"
  - "Multi-Agent Fan-Out Research Flow"
  - "Context Compaction Routine"
  - "Canonical Overlay and Re-seed Flow"
  - "Obsidian Transaction Review Flow"
  - "Release Verification Flow"
verification_modes:
  - "fresh official-source and claim-ledger review"
  - "schema, referential-integrity, and stale-evidence tests"
  - "fresh-context doctrine verifier"
  - "temporary-directory pipeline and malformed-input tests"
  - "deterministic tree-hash comparison with pinned as-of date"
  - "repository lint, strict Claude Obsidian lint, and Brainstein audit"
eval_seed_count: 30
secretary_mode: "single"
curator_themes:
  - "Google Search and AI features"
  - "Google Business Profile policy and APIs"
  - "Maps, Places, citations, reviews, and privacy"
  - "Local-search empirical evidence and counter-positions"
  - "Deterministic generation, product behavior, and release evidence"
publish_surface: "private-source-available-repository"
public_exclude_patterns:
  - ".raw"
  - ".obsidian"
  - ".vault-meta"
  - "hot.md"
  - "log.md"
  - "references/source-ledger.json"
  - "references/claim-ledger.json"
  - "references/claim-ledger.md"
  - "*.docx"
  - "*.zip"
public_content_policy: "publish only reviewed summaries, source links, compliant brief excerpts, generated sample data, and documented behavior; never publish private inputs, credentials, identities, or local paths"
corpus_scope_policy: "every evidence-bearing note states source, locator, assessment, confidence, verified date, refresh date, jurisdiction or feature scope, and material non-scope"
context_budget_policy: "hot cache plus coverage matrix and ledgers, with just-in-time retrieval of relevant claims, sources, policies, and generated-note ownership"
retrieval_pattern: "generic Obsidian folders plus source-to-claim-to-note graph traversal, hubs, aliases, and generated evidence projections"
provenance_trace_policy: "source to claim to overlay to generated note to approval decision to deliverable and release evidence"
memory_governance_policy: "write, store, retrieve, execute, share, forget, retain, rollback, and refresh under explicit operator ownership and privacy boundaries"
mutation_policy: "advisory and read-only for external systems; local repository and vault changes require deterministic targets, hashes, inspection, tests, and rollback"
adapter_domain_depth: "schemas plus source, GBP, citation, review, and geo-grid importers; measured synthesis; deterministic renderers; fixtures; malformed-input, privacy, no-data, and regression tests"
live_api_spend_cap_usd: 0
answer_engine_policy: "publish useful crawlable primary-source passages and clear uncertainty; no special-schema, Reddit, citation-count, or GEO ranking hacks"
substance_profile: "fable-grade"
uncertainty_eval_policy: "reward explicit no-data, unsupported, contested, and needs-input states; penalize confident unsupported policy, ranking, scoring, or product claims"
