<title id="t">The map pack: Google shows three businesses first</title>
<desc id="d">A search for plumber near me shows a map with three pins and three business results. What gets you in: accurate details, real reviews, being close by. What keeps you out: wrong details, stale listings, fake shortcuts.</desc>
