<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Six things Local SEO Brain refuses to do</title>
<desc id="d">Fake addresses or virtual offices, fake or filtered reviews, link schemes and doorway pages, mass directory spam, asking for your passwords, and promising a number one ranking.</desc>
<style>text{font-family:Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .m{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} .r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="560" rx="22" fill="#0D1117"/>
<rect x="0.5" y="0.5" width="1199" height="559" rx="21.5" fill="none" stroke="#2B313B"/>
<text x="72" y="82" font-size="14" font-weight="700" fill="#F07A5E" text-anchor="start" class="m">WHAT IT REFUSES</text>
<text x="72" y="140" font-size="38" font-weight="800" fill="#F2F3F5" text-anchor="start">Six things it will refuse, even if you ask.</text>
<g class="r" style="animation-delay:0.10s">
<rect x="72" y="180" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="94" y="202" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(104 212)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3c-5 0-9 4-9 9 0 7 9 13 9 13s9-6 9-13c0-5-4-9-9-9z"/><path d="M5 5l18 18"/></g>
<text x="94" y="282" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Fake addresses or virtual offices</text>
<text x="94" y="304" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">A mailbox or rented desk is not</text>
<text x="94" y="324" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">a business location.</text>
</g>
<g class="r" style="animation-delay:0.18s">
<rect x="428" y="180" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="450" y="202" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(460 212)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l3.2 6.6 7.3 1-5.3 5.1 1.3 7.3L14 19.6 7.5 23l1.3-7.3-5.3-5.1 7.3-1z"/><path d="M4 4l20 20"/></g>
<text x="450" y="282" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Fake or filtered reviews</text>
<text x="450" y="304" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">No bought, swapped, gated or</text>
<text x="450" y="324" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">selectively requested reviews.</text>
</g>
<g class="r" style="animation-delay:0.26s">
<rect x="784" y="180" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="806" y="202" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(816 212)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-2 2a4 4 0 0 1-6-6l3-3a4 4 0 0 1 6 0"/><path d="M17 11l2-2a4 4 0 0 0-6-6l-3 3"/><path d="M4 4l20 20"/></g>
<text x="806" y="282" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Link schemes and doorway pages</text>
<text x="806" y="304" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">No link networks, hidden text</text>
<text x="806" y="324" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">or pages made only to rank.</text>
</g>
<g class="r" style="animation-delay:0.34s">
<rect x="72" y="356" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="94" y="378" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(104 388)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="22" height="16" rx="2"/><path d="M3 9l11 7 11-7"/><path d="M4 4l20 20"/></g>
<text x="94" y="458" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Mass directory spam</text>
<text x="94" y="480" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">No bulk low-quality listings on</text>
<text x="94" y="500" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">sites nobody uses.</text>
</g>
<g class="r" style="animation-delay:0.42s">
<rect x="428" y="356" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="450" y="378" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(460 388)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="18" height="12" rx="2"/><path d="M9 12V8a5 5 0 0 1 10 0v4"/><path d="M4 4l20 20"/></g>
<text x="450" y="458" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Asking for your passwords</text>
<text x="450" y="480" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">It never logs into your accounts.</text>
<text x="450" y="500" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">You post what you approve.</text>
</g>
<g class="r" style="animation-delay:0.50s">
<rect x="784" y="356" width="344" height="152" rx="18" fill="#161B22" stroke="#2B313B"/>
<rect x="806" y="378" width="48" height="48" rx="12" fill="#3A1A17"/>
<g transform="translate(816 388)" fill="none" stroke="#F0675A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22l6-8 5 4 9-12"/><path d="M4 4l20 20"/></g>
<text x="806" y="458" font-size="19" font-weight="700" fill="#F2F3F5" text-anchor="start">Promising a number one ranking</text>
<text x="806" y="480" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">Nobody can promise a rank.</text>
<text x="806" y="500" font-size="14" font-weight="400" fill="#9AA1AD" text-anchor="start">It refuses to, and says why.</text>
</g>
</svg>
