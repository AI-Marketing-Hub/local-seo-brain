<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">AI Search Evidence Boundaries</title>
<desc id="desc">Six equal evidence checks for AI search work. The diagram contains no ranking weights or guaranteed tactics.</desc>
<defs><style>
.h1{font:700 28px Inter,Arial,sans-serif;fill:#172033}.h2{font:700 16px Inter,Arial,sans-serif;fill:#fff}.lbl{font:500 13px Inter,Arial,sans-serif;fill:#fff}.note{font:500 12px Inter,Arial,sans-serif;fill:#475569}.box{rx:10}
</style></defs>
<rect width="1040" height="540" fill="#fafaf7"/>
<text x="40" y="48" class="h1">AI Search Evidence Boundaries</text>
<text x="40" y="74" class="note">Equal review checks, not a ranking order, formula, percentage, or inclusion guarantee.</text>

<g transform="translate(40,105)"><rect width="300" height="110" class="box" fill="#7c4ddb"/><text x="18" y="32" class="h2">Ordinary Search eligibility</text><text x="18" y="58" class="lbl">Meet crawl, index, policy, and</text><text x="18" y="78" class="lbl">people-first content requirements.</text></g>
<g transform="translate(370,105)"><rect width="300" height="110" class="box" fill="#2f7f87"/><text x="18" y="32" class="h2">Attributable facts</text><text x="18" y="58" class="lbl">Use supplied first-hand facts.</text><text x="18" y="78" class="lbl">Do not fabricate experience.</text></g>
<g transform="translate(700,105)"><rect width="300" height="110" class="box" fill="#c85f4d"/><text x="18" y="32" class="h2">Structured data limits</text><text x="18" y="58" class="lbl">Represent page facts accurately.</text><text x="18" y="78" class="lbl">No special AI schema is required.</text></g>

<g transform="translate(40,245)"><rect width="300" height="110" class="box" fill="#586f92"/><text x="18" y="32" class="h2">Scoped measurement</text><text x="18" y="58" class="lbl">Record query, locale, device,</text><text x="18" y="78" class="lbl">date, method, and limitations.</text></g>
<g transform="translate(370,245)"><rect width="300" height="110" class="box" fill="#b7791f"/><text x="18" y="32" class="h2">Platform volatility</text><text x="18" y="58" class="lbl">Verify current feature and report</text><text x="18" y="78" class="lbl">availability before each claim.</text></g>
<g transform="translate(700,245)"><rect width="300" height="110" class="box" fill="#047857"/><text x="18" y="32" class="h2">Ethical participation</text><text x="18" y="58" class="lbl">No fake community experience,</text><text x="18" y="78" class="lbl">undisclosed promotion, or spam.</text></g>

<rect x="40" y="390" width="960" height="90" rx="10" fill="#172033"/>
<text x="60" y="422" class="h2">Current doctrine</text>
<text x="60" y="448" class="lbl">Google documents no mandatory special schema, AI text file, or separate technical requirement for AI features.</text>
<text x="60" y="468" class="lbl">Treat every empirical tactic as scoped and refresh platform claims on their ledger schedule.</text>
<text x="40" y="515" class="note">See the Claim Ledger and 2026 AI search doctrine note for source IDs, locators, dates, and contested observations.</text>
</svg>
